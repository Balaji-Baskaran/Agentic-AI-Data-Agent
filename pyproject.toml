[project]
name = "data-agent"
version = "0.1.0"
description = "Autonomous Data Agent with SQL Analysis and ETL Automation powered by LangGraph, Groq, and PostgreSQL"
readme = "README.md"
authors = [
    { name = "Balaji-Baskaran", email = "yuvabalaji572@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "python-dotenv>=1.0.0",
    "ipython>=9.18.1",
    "langchain>=1.4.7",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "pandas>=3.1.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.2",
    "pyarrow>=15.0.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
